name: Build Installers

on:
  workflow_dispatch:
    inputs:
      job:
        description: 'Build which platform'
        required: false
        default: all
        type: choice
        options:
          - all
          - windows
          - macos
  push:
    tags:
      - 'v*'

jobs:
  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win
      - uses: actions/upload-artifact@v4
        with:
          name: jianpu-studio-windows
          path: dist-electron/*.exe
          if-no-files-found: error

  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'macos'
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --mac --universal
      - uses: actions/upload-artifact@v4
        with:
          name: jianpu-studio-macos
          path: dist-electron/*.dmg
          if-no-files-found: error
